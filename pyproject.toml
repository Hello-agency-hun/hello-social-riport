[project]
name = "hello-reporting"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "pillow>=10.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "fonttools[woff]>=4.50", "pymupdf>=1.24"]

# A repo gyökerében a `pipeline` mellett `assets`, `templates`, `tools` és `docs`
# is van. Ezek nem Python-csomagok, de a setuptools automatikus felderítése
# annak nézné őket, és `pip install -e .` hibával állna meg. Ezért soroljuk fel
# explicit módon, mi a csomag.
[tool.setuptools]
packages = ["pipeline", "pipeline.parsers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not network'"
markers = ["network: hálózatot igényel, alapból kihagyva"]
