[project]
name = "hello-reporting"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "pillow>=10.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "fonttools[woff]>=4.50"]

[tool.pytest.ini_options]
testpaths = ["tests"]
